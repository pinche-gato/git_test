<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Routine</title>
    
</head>
<body>
    <h1>My Workout Routine</h1>
    <p>This is a short summary of my workout today.</p>
    <h2>The Workout</h2>
    <p>I started my workout by:</p>
    <ol>
        <li>Warming up with arm circles.</li>
        <li>Calf Stretches</li>
        <li>Squats</li>
    </ol>
    <p>After warm up I started my full body workout</p>
    <h2>Full Body Workout</h2>
    <p>My full body workout was designed by Kickoff app.</p>

<form>
    <!--Weights-->
    <label for="w1">Weights</label>
    <input type="checkbox" id="w1"><br>
    <!--Cardio-->
    <label for="c1">Cardio</label>
    <input type="checkbox" id="c1"><br>
    <label for="woDate">Workout Date</label>
    <input type="date" class="woDate">
    <input type="time" class="woDate"><br>
    <label for="c2">Complete</label>
    <input type="radio" class="c2">
</form>




</body>
</html>
